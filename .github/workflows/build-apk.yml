name: Build APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest runner'ında Android SDK hazır ($ANDROID_HOME); yalnızca lisanslar ve platform
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Paket adı farklıysa AGP derleme sırasında kendisi indirir
          "$SDKMANAGER" "platforms;android-37" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: camera-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
